[project]
name = "orchestrator-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "orchestrator-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator_mcp"]

[tool.uv.sources]
orchestrator-core = { workspace = true }
