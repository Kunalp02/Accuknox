[project]
name = "orchestrator-events"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "redis>=5.0",
    "orchestrator-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator_events"]

[tool.uv.sources]
orchestrator-core = { workspace = true }
