[project]
name = "orchestrator-runtime"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "orchestrator-core",
    "orchestrator-llm",
    "orchestrator-rag",
    "orchestrator-mcp",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator_runtime"]

[tool.uv.sources]
orchestrator-core = { workspace = true }
orchestrator-llm = { workspace = true }
orchestrator-rag = { workspace = true }
orchestrator-mcp = { workspace = true }
