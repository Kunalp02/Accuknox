[project]
name = "orchestrator"
version = "0.1.0"
description = "Multi-agent orchestrator platform"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/llm",
    "packages/rag",
    "packages/mcp",
    "packages/runtime",
    "packages/events",
    "apps/api",
    "apps/worker",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
