[project]
name = "orchestrator"
version = "0.1.0"
description = "Multi-agent orchestrator platform"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
override-dependencies = ["bcrypt<5"]

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/llm",
    "packages/rag",
    "packages/mcp",
    "packages/runtime",
    "packages/events",
    "apps/api",
    "apps/worker",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
