[project]
name = "orchestrator-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "arq>=0.26",
    "httpx>=0.27",
    "orchestrator-core",
    "orchestrator-llm",
    "orchestrator-rag",
    "orchestrator-runtime",
    "orchestrator-events",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator_worker"]

[tool.uv.sources]
orchestrator-core = { workspace = true }
orchestrator-llm = { workspace = true }
orchestrator-rag = { workspace = true }
orchestrator-runtime = { workspace = true }
orchestrator-events = { workspace = true }
