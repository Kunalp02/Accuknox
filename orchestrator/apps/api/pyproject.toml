[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator_api"]

[project]
name = "orchestrator-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "orchestrator-core",
    "orchestrator-llm",
    "orchestrator-rag",
    "orchestrator-runtime",
    "orchestrator-events",
    "arq>=0.26",
    "python-multipart>=0.0.9",
    "email-validator>=2.0",
]

[tool.uv.sources]
orchestrator-core = { workspace = true }
orchestrator-llm = { workspace = true }
orchestrator-rag = { workspace = true }
orchestrator-runtime = { workspace = true }
orchestrator-events = { workspace = true }
