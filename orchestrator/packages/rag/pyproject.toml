[project]
name = "orchestrator-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "qdrant-client>=1.11",
    "orchestrator-core",
    "orchestrator-llm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator_rag"]

[tool.uv.sources]
orchestrator-core = { workspace = true }
orchestrator-llm = { workspace = true }
